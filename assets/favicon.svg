<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF4BD"/>
      <stop offset="40%" stop-color="#D4AF37"/>
      <stop offset="100%" stop-color="#8C6514"/>
    </linearGradient>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141419"/>
      <stop offset="100%" stop-color="#08080A"/>
    </linearGradient>
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <!-- Background Shield / Hexagon -->
  <polygon points="50,4 92,26 92,74 50,96 8,74 8,26" fill="url(#bgGrad)" stroke="url(#goldGrad)" stroke-width="3"/>
  <polygon points="50,11 85,29 85,71 50,89 15,71 15,29" fill="none" stroke="url(#goldGrad)" stroke-width="1" stroke-opacity="0.4"/>
  <!-- Monogram MIR / IR -->
  <text x="50" y="61" font-family="'Cinzel', 'Playfair Display', 'Times New Roman', serif" font-size="34" font-weight="700" fill="url(#goldGrad)" text-anchor="middle" letter-spacing="1.5" filter="url(#goldGlow)">IR</text>
</svg>
